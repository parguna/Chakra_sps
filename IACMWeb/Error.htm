<HTML><HEAD>
    <style>
        .page .nav > li {
            display: none;
        }

        .aligncenter {
            text-align: center;
        }
        
        #black {
            color: #000 !important;
            font-size: 35px;
        }
        
        #errormsg {
            font-size: 20px;
            line-height: 1.2em;
        }

        #ac-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(238, 238, 238, .8);
            z-index: 1001;
        }

        #popup {
            width: 550px;

            background: #fff;

            -moz-border-radius: 10px;
            -webkit-border-radius: 10px;
            border: 1px solid #DDD;
            box-shadow: #ccc 0px 0px 3px 3px;

            -webkit-box-shadow: #ccc 0px 0px 3px 3px;

            -moz-border-radius: 25px;
            -webkit-border-radius: 25px;*/

            /*left: 375px;*/

        }
    </style>

    <script type="text/javascript">
        function PopUp(hideOrshow) {
            if (hideOrshow == 'hide') document.getElementById('ac-wrapper').style.display = "none";
            else document.getElementById('ac-wrapper').removeAttribute('style');
            alert(document.referrer);
            if (document.referrer) {
               
                document.getElementById("loginurl").href = document.referrer;
            }else
                document.getElementById("loginurl").href = location.protocol+"//"+ window.location.host+"/login.aspx";
        }

                <span id="black">Error Occurred, please contact administrator.</span></h2>
            <h5 class="c-subname"> <a href="#" id="loginurl" onclick="window.history.back();"><b>Go Back </b></a></h5>
        </div>
